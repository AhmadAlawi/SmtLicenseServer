<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" fill="none">
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 58px;
        letter-spacing: -1.5px;
        fill: #0F172A;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 3.2px;
        text-transform: uppercase;
        fill: #64748B;
      }
    </style>
  </defs>

  <!-- Canvas Background (Clean White) -->
  <rect width="760" height="220" rx="16" fill="#FFFFFF"/>

  <!-- Brand Mark / Icon Container (Total 140x140 at x=50, y=40) -->
  <g transform="translate(50, 40)">
    <!-- Base Card / Till Foundation -->
    <rect x="12" y="78" width="116" height="42" rx="10" fill="#0D9488"/>
    <!-- Cash Drawer Slot / Subtle Register Detail -->
    <rect x="26" y="96" width="44" height="6" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="98" cy="99" r="4" fill="#FFFFFF" opacity="0.95"/>

    <!-- Upward Growth & Branching Network Nodes (Storefront Canopy + Multi-branch Connectivity) -->
    <!-- Connection lines -->
    <path d="M70 78 V34" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 48 L38 68" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 48 L102 68" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Node (Peak / Cloud Hub) -->
    <rect x="54" y="16" width="32" height="32" rx="8" fill="#0F172A"/>
    <!-- Upward Arrow inside apex node -->
    <path d="M70 24 L63 32 H67 V38 H73 V32 H77 Z" fill="#2DD4BF"/>

    <!-- Left Branch Node -->
    <circle cx="34" cy="70" r="10" fill="#0F172A"/>
    <circle cx="34" cy="70" r="4" fill="#5EEAD4"/>

    <!-- Right Branch Node -->
    <circle cx="106" cy="70" r="10" fill="#0F172A"/>
    <circle cx="106" cy="70" r="4" fill="#5EEAD4"/>
  </g>

  <!-- Wordmark & Descriptor -->
  <g transform="translate(225, 118)">
    <text x="0" y="0" class="brand-title">Tillora</text>
    <!-- Dot accent in primary teal -->
    <circle cx="178" cy="-8" r="6" fill="#0D9488"/>
    <text x="2" y="32" class="brand-subtitle">Retail Cloud POS</text>
  </g>
</svg>