<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" fill="none">
  <defs>
    <style>
      .brand-title-dark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 58px;
        letter-spacing: -1.5px;
        fill: #FFFFFF;
      }
      .brand-subtitle-dark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 3.2px;
        text-transform: uppercase;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <!-- Dark Slate/Indigo Surface -->
  <rect width="760" height="220" rx="16" fill="#0F172A"/>

  <!-- Brand Mark / Inverted Icon -->
  <g transform="translate(50, 40)">
    <!-- Base Drawer Foundation -->
    <rect x="12" y="78" width="116" height="42" rx="10" fill="#14B8A6"/>
    <!-- Drawer Accent -->
    <rect x="26" y="96" width="44" height="6" rx="3" fill="#0F172A"/>
    <circle cx="98" cy="99" r="4" fill="#0F172A"/>

    <!-- Network Connections -->
    <path d="M70 78 V34" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 48 L38 68" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 48 L102 68" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

    <!-- Apex Node -->
    <rect x="54" y="16" width="32" height="32" rx="8" fill="#F8FAFC"/>
    <path d="M70 24 L63 32 H67 V38 H73 V32 H77 Z" fill="#0F172A"/>

    <!-- Branch Nodes -->
    <circle cx="34" cy="70" r="10" fill="#F8FAFC"/>
    <circle cx="34" cy="70" r="4" fill="#0D9488"/>

    <circle cx="106" cy="70" r="10" fill="#F8FAFC"/>
    <circle cx="106" cy="70" r="4" fill="#0D9488"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(225, 118)">
    <text x="0" y="0" class="brand-title-dark">Tillora</text>
    <circle cx="178" cy="-8" r="6" fill="#2DD4BF"/>
    <text x="2" y="32" class="brand-subtitle-dark">Retail Cloud POS</text>
  </g>
</svg>